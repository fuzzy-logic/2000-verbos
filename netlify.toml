[build]
  publish = "dist"

# No build step: dist/ is committed ready to serve.

[[headers]]
  for = "/audio/*"
  [headers.values]
    # Audio packs are content-addressed by chunk range and never change in place,
    # so let the browser keep them forever. Cuts repeat bandwidth to zero.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
