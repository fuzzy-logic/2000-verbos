[build]
  publish = "dist"

# No build step: dist/ is committed ready to serve.

[[headers]]
  for = "/audio/*"
  [headers.values]
    # A topic pack DOES change in place when a sentence in it is corrected, so
    # the app fetches it with ?v=<hash of its index>. That makes the URL change
    # with the content, which is what makes keeping it forever safe.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The service worker precaches these at install, so a stale browser copy would
# be baked into the new cache. They must always be revalidated.
[[headers]]
  for = "/conjugations.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/edges.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/pron.json"
  [headers.values]
    Cache-Control = "no-cache"

# The deploy stamp exists to be asked "what is live". A cached answer to that
# question is worse than no answer.
[[headers]]
  for = "/build.json"
  [headers.values]
    Cache-Control = "no-store"
    X-Config-Probe = "v1"

# Served as application/octet-stream by default, and some browsers refuse to
# install the PWA unless the manifest carries its own type.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
